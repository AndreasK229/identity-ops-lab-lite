services:
  api:
    build: .
    environment:
      IOL_API_HOST: 0.0.0.0
      IOL_API_PORT: 4173
      IOL_WEB_ORIGIN: http://localhost:5173
      IOL_ENABLE_OLLAMA: "false"
    ports:
      - "127.0.0.1:4173:4173"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:web -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:4173
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
